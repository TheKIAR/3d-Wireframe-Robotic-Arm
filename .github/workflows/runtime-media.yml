name: Runtime Demo Capture

on:
  push:
    paths-ignore:
      - "assets/runtime-screenshot.png"
      - "assets/demo.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick
      - name: Compile
        run: javac App.java RoboticArm.java
      - name: Capture runtime screenshot and GIF
        run: |
          mkdir -p assets/capture-frames
          cat > Capture.java <<'JAVA'
          import java.awt.*;
          import java.awt.event.KeyEvent;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class Capture {
            public static void main(String[] args) throws Exception {
              new Thread(() -> App.main(new String[0])).start();
              Robot robot = new Robot();
              Thread.sleep(2500);
              Rectangle screen = new Rectangle(Toolkit.getDefaultToolkit().getScreenSize());
              int[] keys = {KeyEvent.VK_Q, KeyEvent.VK_W, KeyEvent.VK_E, KeyEvent.VK_R,
                            KeyEvent.VK_A, KeyEvent.VK_S, KeyEvent.VK_D, KeyEvent.VK_F};
              for (int i = 0; i < 24; i++) {
                if (i < keys.length) {
                  robot.keyPress(keys[i]);
                  Thread.sleep(90);
                  robot.keyRelease(keys[i]);
                }
                BufferedImage image = robot.createScreenCapture(screen);
                ImageIO.write(image, "png", new File(String.format("assets/capture-frames/frame-%02d.png", i)));
                Thread.sleep(140);
              }
              ImageIO.write(robot.createScreenCapture(screen), "png", new File("assets/runtime-screenshot.png"));
              System.exit(0);
            }
          }
          JAVA
          javac Capture.java
          xvfb-run -a -s "-screen 0 1200x900x24" java Capture
          magick -delay 9 -loop 0 assets/capture-frames/frame-*.png assets/demo.gif
          rm -rf assets/capture-frames Capture.java
      - name: Commit runtime media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime-screenshot.png assets/demo.gif
          git diff --cached --quiet || git commit -m "Add actual runtime screenshot and GIF demo"
          git push
